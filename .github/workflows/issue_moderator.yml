name: Issue moderator

on:
  issues:
    types: [ opened, edited, reopened ]
  issue_comment:
    types: [ created ]
  # keiyoushi would also run this daily:
  # schedule:
  #   - cron: '17 6 * * *'
  workflow_dispatch:

# Everything is done with the GitHub App's token; the workflow token needs nothing.
permissions: {}

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # All comments, labels, closes and removal PRs come from the GitHub App, under one name.
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SOURCE_REMOVAL_APP_ID }}
          private-key: ${{ secrets.SOURCE_REMOVAL_APP_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Moderate issues
        uses: hazptr/issue-moderator-action@743539f731ae25423952a383bee81760476b7f05 # source-lifecycle-dist
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          duplicate-label: Duplicate

          duplicate-check-enabled: true
          duplicate-check-labels: |
            ["Source request", "Domain changed"]

          existing-check-enabled: true
          existing-check-labels: |
            ["Source request", "Domain changed"]
          existing-check-repo-url: https://raw.githubusercontent.com/hazptr/source-removal-test/main/index.json

          url-search-sections: |
            ["Source link", "Source new URL"]

          auto-close-ignore-label: do-not-autoclose

          source-check-enabled: true
          source-check-labels: |
            ["Source is down", "Bug"]
          source-check-exclude-labels: |
            ["Source request"]
          previously-deleted-label: Previously deleted
          site-issues-label: Site Issues

          removal-enabled: true
          # keiyoushi: 14. Zero here so the demo does not have to wait.
          removal-days: '0'
          # Source requests whose site stays down are closed after the same wait, without a PR.
          source-request-label: Source request
          # New requests whose domain is gone (DNS/RDAP only) are marked down, so they close after the wait.
          request-dns-check-enabled: true
          # keiyoushi: 7 (each open request rechecked weekly). One here so every run checks all.
          request-recheck-days: '1'
          pr-token: ${{ steps.app-token.outputs.token }}
