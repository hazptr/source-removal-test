<!doctype html>
<meta charset="utf-8">
<title>Create the source removal test app</title>
<p>Creates a private GitHub App for <code>hazptr/source-removal-test</code> with only
Contents (read and write) and Pull requests (read and write), and no webhook.</p>
<form action="https://github.com/settings/apps/new?state=b134bdd07d4e43e9" method="post">
  <input type="hidden" name="manifest" id="manifest">
  <button type="submit">Continue to GitHub</button>
</form>
<script>
document.getElementById('manifest').value = JSON.stringify({
  name: 'hazptr-source-removal-test',
  url: 'https://github.com/hazptr/source-removal-test',
  description: 'Opens removal pull requests in hazptr/source-removal-test (test of issue-moderator-action).',
  hook_attributes: { url: 'https://example.com/unused', active: false },
  redirect_url: 'https://hazptr.github.io/source-removal-test/done.html',
  public: false,
  default_permissions: { contents: 'write', pull_requests: 'write' },
  default_events: []
});
</script>
